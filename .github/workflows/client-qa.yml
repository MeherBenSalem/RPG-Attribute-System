name: Real client GUI evidence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/client-qa.yml'
      - 'scripts/client-qa/**'
      - 'tests/client-qa/**'
      - '1.21.1/common/src/main/java/tn/nightbeam/ras/client/**'
      - '26.3/common/src/main/java/tn/nightbeam/ras/client/**'
      - '1.21.1/fabric/build.gradle'
      - '26.3/fabric/build.gradle'

permissions:
  contents: read

concurrency:
  group: real-client-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  QA_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  LIBGL_ALWAYS_SOFTWARE: 'true'
  GALLIUM_DRIVER: llvmpipe

jobs:
  client-1211:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate evidence/watchdog code
        run: python3 -m unittest discover -s tests/client-qa -v
      - name: Prepare real software-rendered X11 client
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64 ffmpeg xdotool python3-pil
      - name: Generate genuine demo world and exercise scales 2 through 4
        run: |
          xvfb-run -a -s '-screen 0 1280x960x24 +extension GLX -nolisten tcp' \
            python3 scripts/client-qa/run.py --workspace 1.21.1 --source-sha "$QA_SOURCE_SHA" \
            --output "$RUNNER_TEMP/ras-client-qa-1211" --fixture-output "$RUNNER_TEMP/ras-disposable-fixture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-client-evidence-1.21.1
          path: ${{ runner.temp }}/ras-client-qa-1211/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: generated-disposable-demo-fixture
          path: ${{ runner.temp }}/ras-disposable-fixture/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  client-263:
    needs: client-1211
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RAS_GRAPHICS_BACKEND: vulkan
      SDL_VIDEO_DRIVER: x11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated-disposable-demo-fixture
          path: ${{ runner.temp }}/ras-disposable-fixture
      - name: Prepare real lavapipe Vulkan X11 client
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 vulkan-tools libxres1 libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64 ffmpeg xdotool python3-pil
      - name: Quick-play a verified generated world and exercise scales 2 through 4
        run: |
          xvfb-run -a -s '-screen 0 1280x960x24 +extension GLX -nolisten tcp' bash -e -c '
            preserve_preflight() {
              mkdir -p "$RUNNER_TEMP/ras-client-qa-263"
              if [ -f "$RUNNER_TEMP/ras-client-qa-263-x11-preflight.json" ]; then
                cp "$RUNNER_TEMP/ras-client-qa-263-x11-preflight.json" "$RUNNER_TEMP/ras-client-qa-263/x11-infrastructure-preflight.json"
              else
                printf "{\"schema_version\":1,\"source_sha\":\"%s\",\"status\":\"FAIL\",\"kind\":\"x11-infrastructure-only-not-minecraft-acceptance\",\"reason\":\"bounded_preflight_no_result\"}\n" "$QA_SOURCE_SHA" > "$RUNNER_TEMP/ras-client-qa-263/x11-infrastructure-preflight.json"
              fi
            }
            trap preserve_preflight EXIT
            env -u GITHUB_TOKEN timeout 20s python3 scripts/client-qa/window_identity.py --self-test --source-sha "$QA_SOURCE_SHA" \
              --output "$RUNNER_TEMP/ras-client-qa-263-x11-preflight.json"
            python3 scripts/client-qa/run.py --workspace 26.3 --source-sha "$QA_SOURCE_SHA" \
              --output "$RUNNER_TEMP/ras-client-qa-263" --fixture-input "$RUNNER_TEMP/ras-disposable-fixture"
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-client-evidence-26.3
          path: ${{ runner.temp }}/ras-client-qa-263/
          if-no-files-found: warn
          retention-days: 14


  # Auxiliary PR48 diagnosis only. It cannot replace either normal native job.
  client-263-diagnostic:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 48 &&
      github.repository == 'MeherBenSalem/RPG-Attribute-System' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/ras-4.3.0-progression-studio'
    name: PR48 26.3 diagnostic only (not native acceptance)
    continue-on-error: true  # Auxiliary failure must not change the normal native gate.
    permissions:
      contents: read
      actions: read  # Ephemeral, diagnostic-job-only access to the pinned public artifact.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RAS_GRAPHICS_BACKEND: vulkan
      SDL_VIDEO_DRIVER: x11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate diagnostic and unchanged evidence/watchdog code
        run: python3 -m unittest discover -s tests/client-qa -v
      - name: Prepare real lavapipe Vulkan X11 client
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-utils libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers libvulkan1 vulkan-tools libxres1 libxrandr2 libxinerama1 libxcursor1 libxi6 libasound2t64 ffmpeg xdotool python3-pil
      - name: Diagnose 26.3 with the exact verified 891 producer fixture
        env:
          # Existing ephemeral token, read-only job scope. A denied artifact read fails closed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          xvfb-run -a -s '-screen 0 1280x960x24 +extension GLX -nolisten tcp' bash -e -c '
            preserve_preflight() {
              mkdir -p "$RUNNER_TEMP/ras-client-qa-263-diagnostic"
              if [ -f "$RUNNER_TEMP/ras-client-qa-263-diagnostic-x11-preflight.json" ]; then
                cp "$RUNNER_TEMP/ras-client-qa-263-diagnostic-x11-preflight.json" "$RUNNER_TEMP/ras-client-qa-263-diagnostic/x11-infrastructure-preflight.json"
              else
                printf "{\"schema_version\":1,\"source_sha\":\"%s\",\"status\":\"FAIL\",\"kind\":\"x11-infrastructure-only-not-minecraft-acceptance\",\"reason\":\"bounded_preflight_no_result\"}\n" "$QA_SOURCE_SHA" > "$RUNNER_TEMP/ras-client-qa-263-diagnostic/x11-infrastructure-preflight.json"
              fi
            }
            trap preserve_preflight EXIT
            env -u GITHUB_TOKEN timeout 20s python3 scripts/client-qa/window_identity.py --self-test --source-sha "$QA_SOURCE_SHA" \
              --output "$RUNNER_TEMP/ras-client-qa-263-diagnostic-x11-preflight.json"
            python3 scripts/client-qa/run.py --workspace 26.3 --source-sha "$QA_SOURCE_SHA" \
              --output "$RUNNER_TEMP/ras-client-qa-263-diagnostic" --diagnostic-pr48-fixture
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-only-client-evidence-26.3-pr48
          path: ${{ runner.temp }}/ras-client-qa-263-diagnostic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
