# A release tag is created only after final source review, CI and client/gameplay QA.
# Always build/verify all eight loader JARs; partial prebuilt directories are never trusted.
# NightBeam publishes to CurseForge only (since 24 Nov 2026).
# Same-day guard (NightBeam convention): scripts/same_day_guard.mjs stops a real release if this mod already had one
# today (Africa/Tunis day) on CurseForge or in an earlier Publish run. It runs before the build and again right
# before the upload. A dry run only reports.
# Repo secrets: CURSEFORGE_TOKEN (upload token), CURSEFORGE_API_KEY (Core API key, for the same-day guard and the
# publisher's inventory checks). Repo variable: CURSEFORGE_ID (the publisher refuses any project but 1079687).
# The existing Modrinth project stays up as it is but gets no new versions.
name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must equal checked-out VERSION)
        required: false
        type: string
      dry_run:
        description: Verify and prepare descriptors without store writes
        required: false
        default: true
        type: boolean
      source_run_id:
        description: Prior Publish run containing the exact eight source-bound JARs (avoids rebuilding on recovery)
        required: false
        type: string

      receipt_run_id:
        description: Latest prior Publish run containing the upload journal (defaults to source_run_id)
        required: false
        type: string
      continue_past_pending_curseforge:
        description: Recovery only - upload the remaining CurseForge files while verified earlier ones await review
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # One Publish at a time per repo: a dry-run and a tag release never create competing journals,
  # and two runs can't both pass the same-day guard.
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      receipt_run_id: ${{ steps.resolve.outputs.receipt_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve exact source/version and fail closed
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECEIPT_RUN_ID: ${{ inputs.receipt_run_id }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          requested=os.environ.get('REQUESTED_VERSION','')
          if not re.fullmatch(r'\d+\.\d+\.\d+',version) or (requested and requested!=version):
              raise SystemExit('Requested version must equal checked-out VERSION')
          for root in ['1.20.1','1.21.1','26.2','26.3']:
              rows=Path(root,'gradle.properties').read_text().splitlines()
              if 'version='+version not in rows: raise SystemExit('Version roots disagree')
          dry_run='true' if os.environ.get('REQUESTED_DRY_RUN')=='true' else 'false'
          if dry_run=='false' and os.environ['GITHUB_REF']!='refs/tags/v'+version:
              raise SystemExit('Store writes require the exact release tag; use dry_run for branch verification')
          run_id=os.environ.get('SOURCE_RUN_ID','')
          receipt_id=os.environ.get('RECEIPT_RUN_ID','') or run_id
          if receipt_id and not run_id: raise SystemExit('receipt_run_id requires source_run_id')
          if any(value and not re.fullmatch(r'[1-9]\d*',value) for value in [run_id,receipt_id]): raise SystemExit('Invalid recovery run ID')
          if dry_run=='false' and int(os.environ.get('GITHUB_RUN_ATTEMPT','1'))>1 and not run_id:
              raise SystemExit('Bare job reruns cannot recover upload state; dispatch an explicit recovery run')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}',commit): raise SystemExit('Invalid source commit')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,value in [('version',version),('commit',commit),('dry_run',dry_run),('source_run_id',run_id),('receipt_run_id',receipt_id)]:
                  print(f'{key}={value}',file=output)
          PY
      - name: Same-day guard
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Publish/resume verified binaries with per-loader dependencies|Upload Modrinth + CurseForge
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
        run: node scripts/same_day_guard.mjs
      - name: Reject blind fresh publication after a prior attempt
        if: ${{ steps.resolve.outputs.source_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: python3 scripts/validate-release-recovery.py --commit "$SOURCE_COMMIT" --current-run-id "$GITHUB_RUN_ID" --check-fresh
  build:
    name: Build ${{ matrix.workspace }}
    needs: resolve
    if: ${{ needs.resolve.outputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: '1.20.1'
            java: '17'
            second_loader: forge
          - workspace: '1.21.1'
            java: '21'
            second_loader: neoforge
          - workspace: '26.2'
            java: '25'
            second_loader: neoforge
          - workspace: '26.3'
            java: '25'
            second_loader: neoforge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders and common checks at exact source commit
        working-directory: ${{ matrix.workspace }}
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: bash ./gradlew build --no-daemon -PrasSourceCommit="$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: ras-release-${{ needs.resolve.outputs.commit }}-${{ matrix.workspace }}
          path: |
            ${{ matrix.workspace }}/fabric/build/libs/rpg_attribute_system-fabric-${{ matrix.workspace }}-${{ needs.resolve.outputs.version }}.jar
            ${{ matrix.workspace }}/${{ matrix.second_loader }}/build/libs/rpg_attribute_system-${{ matrix.second_loader }}-${{ matrix.workspace }}-${{ needs.resolve.outputs.version }}.jar
          if-no-files-found: error
  publish:
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.resolve.outputs.source_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject live publish-only job reruns without fresh recovery
        env:
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo 'Live publish job reruns cannot safely restore state; dispatch a fresh explicit recovery run.'
            exit 1
          fi
      - name: Validate explicit recovery run provenance
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          RECEIPT_RUN_ID: ${{ needs.resolve.outputs.receipt_run_id }}
        run: python3 scripts/validate-release-recovery.py --commit "$SOURCE_COMMIT" --source-run-id "$SOURCE_RUN_ID" --receipt-run-id "$RECEIPT_RUN_ID" --current-run-id "$GITHUB_RUN_ID"
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.source_run_id == '' }}
        with:
          pattern: ras-release-${{ needs.resolve.outputs.commit }}-*
          path: release-jars
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        with:
          pattern: ras-release-${{ needs.resolve.outputs.commit }}-*
          path: release-jars
          merge-multiple: true
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        with:
          name: release-provenance-${{ needs.resolve.outputs.commit }}
          path: prior-release-provenance
          run-id: ${{ needs.resolve.outputs.receipt_run_id }}
          github-token: ${{ github.token }}
      - name: Restore mandatory prior upload journal
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        run: |
          test -f prior-release-provenance/publication-receipts.json
          cp prior-release-provenance/publication-receipts.json publication-receipts.json
      - name: Verify complete inventory/internal metadata/source/hash binding
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python3 scripts/verify-release-artifacts.py --directory release-jars --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT" --output verified-release.json
      - name: Dry-run publication descriptors (no store writes)
        if: ${{ needs.resolve.outputs.dry_run == 'true' }}
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
        run: node scripts/publish-verified-release.mjs --manifest verified-release.json --directory release-jars --dependencies scripts/release-dependencies.json --changelog "patchnotes/$RELEASE_VERSION.md" --state publication-receipts.json --platforms curseforge --dry-run
      - name: Same-day guard (again, right before upload)
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        env:
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISH_WORKFLOW: publish.yml
          UPLOAD_STEP: Upload CurseForge|Publish/resume verified binaries with per-loader dependencies|Upload Modrinth + CurseForge
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: node scripts/same_day_guard.mjs
      # The same-day guard's GitHub check counts a run as a release when this exact step name succeeded,
      # so it never runs on a dry run (dry runs use the step above).
      - name: Upload CurseForge
        if: ${{ needs.resolve.outputs.dry_run != 'true' }}
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          CONTINUE_PAST_PENDING_CURSEFORGE: ${{ inputs.continue_past_pending_curseforge }}
        run: |
          test -n "${CURSEFORGE_ID:-}" || { echo "Set the repo variable CURSEFORGE_ID" >&2; exit 1; }
          args=()
          if [ "$CONTINUE_PAST_PENDING_CURSEFORGE" = true ]; then args+=(--continue-past-pending-curseforge); fi
          node scripts/publish-verified-release.mjs --manifest verified-release.json --directory release-jars --dependencies scripts/release-dependencies.json --changelog "patchnotes/$RELEASE_VERSION.md" --state publication-receipts.json --platforms curseforge "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-provenance-${{ needs.resolve.outputs.commit }}
          path: |
            verified-release.json
            publication-receipts.json
          if-no-files-found: ignore
