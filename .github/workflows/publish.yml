# Dual-publish NightBeam mods/plugins to Modrinth + CurseForge on version tags.
# Copy to each mod repo as: .github/workflows/publish.yml
#
# Org/repo secrets:
#   MODRINTH_TOKEN
#   CURSEFORGE_TOKEN
#   CURSEFORGE_API_KEY
#
# Repo variables:
#   MODRINTH_ID
#   CURSEFORGE_ID
#
# Usage after a release build is ready:
#   git tag v1.2.3 && git push --tags

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Skip uploads if true
        required: false
        default: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then ./gradlew build --no-daemon
          else gradle build --no-daemon
          fi

      - name: Find jars
        id: jars
        shell: bash
        run: |
          mapfile -t JARS < <(find . -type f -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" ! -name "*-javadoc.jar" \
            ! -name "*-dev.jar" ! -name "*-dev-shadow.jar" | head -n 20)
          if [ ${#JARS[@]} -eq 0 ]; then
            echo "No jars in build/libs" >&2
            exit 1
          fi
          printf '%s\n' "${JARS[@]}"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "list<<$EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${JARS[@]}" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Upload Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          VERSION: ${{ steps.ver.outputs.version }}
          JAR_LIST: ${{ steps.jars.outputs.list }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODRINTH_ID:-}" && test -n "${CURSEFORGE_ID:-}"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const version = process.env.VERSION;
          const jars = process.env.JAR_LIST.split(/\n/).map(s => s.trim()).filter(Boolean)
            .filter(j => !path.basename(j).startsWith('original-') && !path.basename(j).includes('-common-'));

          function detectLoader(n) {
            n = n.toLowerCase();
            if (n.includes('neoforge')) return 'neoforge';
            if (n.includes('fabric')) return 'fabric';
            if (n.includes('quilt')) return 'quilt';
            if (n.includes('forge')) return 'forge';
            if (/paper|spigot|bukkit|folia|purpur/.test(n)) return 'paper';
            return 'fabric';
          }
          function detectGv(n) {
            n = n.toLowerCase();
            const m = n.match(/(?:neoforge|fabric|quilt|forge|paper)-((?:\d+\.)+\d+)(?:-|\.jar)/)
              || n.match(/\b((?:1|2[0-9])\.\d+(?:\.\d+)?)\b/);
            return m ? m[1] : '1.21.1';
          }

          (async () => {
            // One Modrinth version per jar (never bundle loaders as additional files)
            for (const jar of jars) {
              const name = path.basename(jar);
              const loader = detectLoader(name);
              const gv = detectGv(name);
              const body = {
                name: version,
                version_number: version,
                changelog: `Release ${version}`,
                dependencies: [],
                game_versions: [gv],
                version_type: 'release',
                loaders: [loader],
                featured: false,
                status: 'listed',
                project_id: process.env.MODRINTH_ID,
                file_parts: ['file_0'],
                primary_file: 'file_0',
              };
              const form = new FormData();
              form.append('data', JSON.stringify(body));
              form.append('file_0', new Blob([fs.readFileSync(jar)]), name);
              const mrRes = await fetch('https://api.modrinth.com/v2/version', {
                method: 'POST',
                headers: { Authorization: process.env.MODRINTH_TOKEN },
                body: form,
              });
              const mrText = await mrRes.text();
              if (!mrRes.ok) throw new Error('Modrinth ' + name + ' ' + mrRes.status + ' ' + mrText.slice(0, 500));
              console.log('Modrinth OK', name, loader, gv, mrText.slice(0, 120));
            }

            const gvRes = await fetch('https://minecraft.curseforge.com/api/game/versions', {
              headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN },
            });
            const flat = await gvRes.json();
            const findId = (want, preferType) => {
              const hits = flat.filter((v) => v.name === want);
              if (preferType != null) {
                const hit = hits.find((v) => v.gameVersionTypeID === preferType);
                if (hit) return hit.id;
              }
              if (!hits[0]) throw new Error('No CF game version for ' + want);
              return hits[0].id;
            };
            const client = findId('Client');
            const server = findId('Server');
            const loaderIds = { fabric: findId('Fabric', 68441), forge: findId('Forge', 68441), neoforge: findId('NeoForge', 68441), paper: findId('Bukkit') };

            for (const jar of jars) {
              const name = path.basename(jar);
              const loader = detectLoader(name);
              const gv = detectGv(name);
              const meta = {
                changelog: `Release ${version}`,
                changelogType: 'markdown',
                displayName: name,
                gameVersions: [client, server, loaderIds[loader] || loaderIds.fabric, findId(gv)].filter(Boolean),
                releaseType: 'release',
              };
              const cfForm = new FormData();
              cfForm.append('metadata', JSON.stringify(meta));
              cfForm.append('file', new Blob([fs.readFileSync(jar)]), name);
              const cfRes = await fetch(
                `https://minecraft.curseforge.com/api/projects/${process.env.CURSEFORGE_ID}/upload-file`,
                { method: 'POST', headers: { 'X-Api-Token': process.env.CURSEFORGE_TOKEN }, body: cfForm },
              );
              const cfText = await cfRes.text();
              if (!cfRes.ok) throw new Error('CurseForge ' + cfRes.status + ' ' + cfText.slice(0, 500));
              console.log('CurseForge OK', name, cfText.slice(0, 180));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
