# A release tag is created only after final source review, CI and client/gameplay QA.
# Always build/verify all ten loader JARs; partial prebuilt directories are never trusted.
name: Publish

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must equal checked-out VERSION)
        required: false
        type: string
      dry_run:
        description: Verify and prepare descriptors without store writes
        required: false
        default: true
        type: boolean
      platforms:
        description: Destination platforms (for partial-upload recovery)
        type: choice
        options: [both, modrinth, curseforge]
        default: both
      source_run_id:
        description: Prior Publish run containing the exact ten source-bound JARs (avoids rebuilding on recovery)
        required: false
        type: string

      receipt_run_id:
        description: Latest prior Publish run containing the upload journal (defaults to source_run_id)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # A branch dry-run and tag release must never create competing journals.
  group: ras-release-publication
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      platforms: ${{ steps.resolve.outputs.platforms }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      receipt_run_id: ${{ steps.resolve.outputs.receipt_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact source/version and fail closed
        id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RECEIPT_RUN_ID: ${{ inputs.receipt_run_id }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          requested=os.environ.get('REQUESTED_VERSION','')
          if not re.fullmatch(r'\d+\.\d+\.\d+',version) or (requested and requested!=version):
              raise SystemExit('Requested version must equal checked-out VERSION')
          for root in ['1.20.1','1.21.1','26.1.2','26.2','26.3']:
              rows=Path(root,'gradle.properties').read_text().splitlines()
              if 'version='+version not in rows: raise SystemExit('Version roots disagree')
          platforms=os.environ.get('REQUESTED_PLATFORMS') or 'both'
          if platforms not in ['both','modrinth','curseforge']: raise SystemExit('Unknown platforms')
          dry_run='true' if os.environ.get('REQUESTED_DRY_RUN')=='true' else 'false'
          if dry_run=='false' and os.environ['GITHUB_REF']!='refs/tags/v'+version:
              raise SystemExit('Store writes require the exact release tag; use dry_run for branch verification')
          run_id=os.environ.get('SOURCE_RUN_ID','')
          receipt_id=os.environ.get('RECEIPT_RUN_ID','') or run_id
          if receipt_id and not run_id: raise SystemExit('receipt_run_id requires source_run_id')
          if any(value and not re.fullmatch(r'[1-9]\d*',value) for value in [run_id,receipt_id]): raise SystemExit('Invalid recovery run ID')
          if dry_run=='false' and int(os.environ.get('GITHUB_RUN_ATTEMPT','1'))>1 and not run_id:
              raise SystemExit('Bare job reruns cannot recover upload state; dispatch an explicit recovery run')
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}',commit): raise SystemExit('Invalid source commit')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for key,value in [('version',version),('commit',commit),('platforms',platforms),('dry_run',dry_run),('source_run_id',run_id),('receipt_run_id',receipt_id)]:
                  print(f'{key}={value}',file=output)
          PY
      - name: Reject blind fresh publication after a prior attempt
        if: ${{ steps.resolve.outputs.source_run_id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.resolve.outputs.commit }}
        run: python3 scripts/validate-release-recovery.py --commit "$SOURCE_COMMIT" --current-run-id "$GITHUB_RUN_ID" --check-fresh
  build:
    name: Build ${{ matrix.workspace }}
    needs: resolve
    if: ${{ needs.resolve.outputs.source_run_id == '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - workspace: '1.20.1'
            java: '17'
            second_loader: forge
          - workspace: '1.21.1'
            java: '21'
            second_loader: neoforge
          - workspace: '26.1.2'
            java: '25'
            second_loader: neoforge
          - workspace: '26.2'
            java: '25'
            second_loader: neoforge
          - workspace: '26.3'
            java: '25'
            second_loader: neoforge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both loaders and common checks at exact source commit
        working-directory: ${{ matrix.workspace }}
        env:
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: bash ./gradlew build --no-daemon -PrasSourceCommit="$SOURCE_COMMIT"
      - uses: actions/upload-artifact@v4
        with:
          name: ras-release-${{ needs.resolve.outputs.commit }}-${{ matrix.workspace }}
          path: |
            ${{ matrix.workspace }}/fabric/build/libs/rpg_attribute_system-fabric-${{ matrix.workspace }}-${{ needs.resolve.outputs.version }}.jar
            ${{ matrix.workspace }}/${{ matrix.second_loader }}/build/libs/rpg_attribute_system-${{ matrix.second_loader }}-${{ matrix.workspace }}-${{ needs.resolve.outputs.version }}.jar
          if-no-files-found: error
  publish:
    needs: [resolve, build]
    if: ${{ always() && needs.resolve.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.resolve.outputs.source_run_id != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject live publish-only job reruns without fresh recovery
        env:
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != true ] && [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then
            echo 'Live publish job reruns cannot safely restore state; dispatch a fresh explicit recovery run.'
            exit 1
          fi
      - name: Validate explicit recovery run provenance
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
          SOURCE_RUN_ID: ${{ needs.resolve.outputs.source_run_id }}
          RECEIPT_RUN_ID: ${{ needs.resolve.outputs.receipt_run_id }}
        run: python3 scripts/validate-release-recovery.py --commit "$SOURCE_COMMIT" --source-run-id "$SOURCE_RUN_ID" --receipt-run-id "$RECEIPT_RUN_ID" --current-run-id "$GITHUB_RUN_ID"
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.source_run_id == '' }}
        with:
          pattern: ras-release-${{ needs.resolve.outputs.commit }}-*
          path: release-jars
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        with:
          pattern: ras-release-${{ needs.resolve.outputs.commit }}-*
          path: release-jars
          merge-multiple: true
          run-id: ${{ needs.resolve.outputs.source_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        with:
          name: release-provenance-${{ needs.resolve.outputs.commit }}
          path: prior-release-provenance
          run-id: ${{ needs.resolve.outputs.receipt_run_id }}
          github-token: ${{ github.token }}
      - name: Restore mandatory prior upload journal
        if: ${{ needs.resolve.outputs.source_run_id != '' }}
        run: |
          test -f prior-release-provenance/publication-receipts.json
          cp prior-release-provenance/publication-receipts.json publication-receipts.json
      - name: Verify complete inventory/internal metadata/source/hash binding
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SOURCE_COMMIT: ${{ needs.resolve.outputs.commit }}
        run: python3 scripts/verify-release-artifacts.py --directory release-jars --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT" --output verified-release.json
      - name: Publish/resume verified binaries with per-loader dependencies
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
          PLATFORMS: ${{ needs.resolve.outputs.platforms }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          DRY_RUN: ${{ needs.resolve.outputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          node scripts/publish-verified-release.mjs --manifest verified-release.json --directory release-jars --dependencies scripts/release-dependencies.json --changelog "RPG-Attribute-System-$RELEASE_VERSION-PatchNotes.md" --state publication-receipts.json --platforms "$PLATFORMS" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-provenance-${{ needs.resolve.outputs.commit }}
          path: |
            verified-release.json
            publication-receipts.json
          if-no-files-found: ignore
