def guiSelfTestTask(String name, String rootDirName, String gradleTask) {
    tasks.register(name, Exec) {
        group = 'verification'
        description = "In-game stats menu self-test: ${rootDirName} ${gradleTask}"
        workingDir = file(rootDirName)
        commandLine wrapperCmd(rootDirName), gradleTask, '--no-daemon'
    }
}

