// ──────────────────────────────────────────────
// Version sync — keep 1.20.1 / 1.21.1 / 26.1.2 / 26.2 on the same mod version
// Usage: ./gradlew syncVersion -PrasVersion=4.2.0
// ──────────────────────────────────────────────

tasks.register('syncVersion') {
    group = 'build'
    description = 'Set version= in all workspace gradle.properties (use -PrasVersion=x.y.z or reads VERSION file).'
    doLast {
        def v = project.findProperty('rasVersion')
        if (!v) {
            def versionFile = file('VERSION')
            if (versionFile.exists()) {
                v = versionFile.text.trim()
            }
        }
        if (!v) {
            throw new GradleException('Pass -PrasVersion=x.y.z or add a VERSION file at repo root.')
        }
        file('VERSION').text = v + System.lineSeparator()
        ['1.20.1', '1.21.1', '26.1.2', '26.2'].each { dir ->
            def file = file("${dir}/gradle.properties")
            if (!file.exists()) {
                throw new GradleException("Missing ${file}")
            }
            def lines = file.readLines()
            def updated = false
            def out = lines.collect { line ->
                if (line.startsWith('version=')) {
                    updated = true
                    return "version=${v}"
                }
                return line
            }
            if (!updated) {
                throw new GradleException("No version= line in ${file}")
            }
            file.text = out.join(System.lineSeparator()) + System.lineSeparator()
            println "Synced ${file} -> ${v}"
        }
    }
}

