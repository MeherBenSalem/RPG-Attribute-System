plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    flatDir {
        dir rootProject.file('../libs')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation name: 'jauml-fabric-1.21.1-1.3.0'
}

// Handle duplicate resources from common module
// Use EXCLUDE to prevent duplicates - fabric module resources take precedence
processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        clientSelfTest {
            client()
            setConfigName('Fabric Client Self-Test')
            ideConfigGenerated(true)
            def clientQa = System.getenv('RAS_CLIENT_QA') == 'true'
            def qaRunId = System.getenv('RAS_QA_RUN_ID')
            if (clientQa && !(qaRunId ==~ /[a-zA-Z0-9_-]{8,100}/)) {
                throw new GradleException('Hosted client QA requires a unique valid RAS_QA_RUN_ID')
            }
            runDir(clientQa ? "runs/client-qa/${qaRunId}" : 'runs/client-selftest')
            vmArgs('-Dras.guiSelfTest=true', '-Dras.loader=fabric', '-Dras.mcVersion=1.21.1')
            programArgs('--demo')
            if (clientQa) {
                vmArgs('-Dras.clientQa=true', '-Dras.guiSelfTestHold=true',
                        "-Dras.clientQaRunId=${qaRunId}",
                        "-Dras.clientQaSourceSha=${System.getenv('RAS_QA_SOURCE_SHA')}",
                        "-Dras.clientQaScale=${System.getenv('RAS_QA_SCALE')}")
                programArgs('--width', '1280', '--height', '960', '--quickPlayPath', 'qa-world-join.json')
                vmArgs('-Dras.clientQaAutoDemo=true')
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
